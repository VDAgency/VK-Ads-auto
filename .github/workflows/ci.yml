name: CI

# quality  — гейт качества (на всех ветках/PR).
# frontend — гейт фронта (eslint/prettier/build/tsc).
# security — гейт безопасности (аудит 2026-09-01): секреты, SAST, уязвимые
#            зависимости фронта и бэка. До аудита в CI не было ни одной проверки
#            безопасности — запрет CLAUDE.md §1.1 держался только на глазах ревьюера.
# deploy   — автодеплой на сервер ТОЛЬКО при push в main и только после зелёных
#            quality, frontend и security (см. docs/DEPLOY.md). Секреты — в GitHub
#            Actions Secrets, не в коде.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv + Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      # Тесты раздачи статики (test_web_static, test_static_cache) проверяют реально
      # отданный HTML. Источник файлов теперь web/out, поэтому фронт надо собрать
      # ДО pytest — иначе маунт не поднимется и тесты упадут.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      # Сборка идёт ДО tsc: она генерирует next-env.d.ts и .next/types/routes.d.ts,
      # без которых типы роутов не резолвятся (оба файла в .gitignore как
      # генерируемые — конвенция Next).
      - name: Next build
        run: npm run build

      - name: TypeScript
        run: npm run typecheck

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Полная история: gitleaks проверяет не только рабочее дерево, но и
          # каждый коммит. Секрет, добавленный и удалённый следующим коммитом,
          # остаётся в истории публичного репозитория навсегда.
          fetch-depth: 0

      - name: Gitleaks (секреты в коде и истории)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv + Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      # Падаем только на HIGH: LOW у bandit — это в основном строки русского
      # интерфейса в переменных со словом «password» и `assert` для сужения
      # типов под mypy. Держать гейт на них — значит приучить его игнорировать.
      - name: Bandit (SAST по нашему Python-коду)
        run: uvx bandit -r core bot services integrations db config userbot kotbot -lll -iii -q

      - name: pip-audit (уязвимости зависимостей бэка)
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm audit (уязвимости зависимостей фронта)
        working-directory: web
        run: npm audit --audit-level=high

  deploy:
    runs-on: ubuntu-latest
    needs: [quality, frontend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy over SSH and verify health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            set -e
            cd /opt/vk-ads-auto
            git pull --ff-only
            docker compose up -d --build api postgres redis caddy bot userbot kotbot backup n8n
            # Caddy не пересоздаётся при изменении только примонтированного Caddyfile
            # (bind-mount), а hot-reload в этом окружении не всегда применяется —
            # поэтому перезапускаем caddy детерминированно (кратковременный блип).
            docker compose restart caddy
            # Применяем миграции БД (с ретраями до готовности postgres).
            for i in $(seq 1 10); do
              if docker compose exec -T api uv run alembic upgrade head; then echo "migrations OK"; break; fi
              echo "waiting for db... ($i)"; sleep 3
              if [ "$i" = "10" ]; then echo "migrations FAILED"; docker compose logs --tail=80 postgres; exit 1; fi
            done
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
              if [ "$code" = "200" ]; then echo "health OK"; exit 0; fi
              sleep 3
            done
            echo "health check FAILED"; docker compose logs --tail=80 api; exit 1
