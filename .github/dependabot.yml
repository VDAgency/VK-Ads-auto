# Dependabot: автоматические PR на обновление зависимостей (аудит 2026-09-01).
#
# До аудита слежения за зависимостями не было вовсе, и шесть уязвимостей высокой
# важности во фронте (postcss, sharp, nanoid, js-yaml, brace-expansion) накопились
# незамеченными — их нашёл только ручной `npm audit`.
#
# Python здесь намеренно НЕ настраиваем: зависимости бэка закреплены в `uv.lock`,
# а сторожем служит шаг `pip-audit` в security-джобе CI — он валит сборку на
# уязвимой зависимости, что строже, чем PR с обновлением.
version: 2
updates:
  # Фронт Блока 2 — там и был весь ворох уязвимостей.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Патчи и минорные — одним PR, чтобы не плодить шум на каждую библиотеку.
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Экшены в CI: у них есть доступ к секретам деплоя, поэтому версии держим свежими.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
